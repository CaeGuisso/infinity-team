<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFINITY TEAM</title>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =====================
   THEME VARIABLES
===================== */
:root {
    --bg: #ffffff;
    --text: #0f172a;
    --muted: #475569;
    --card: #ffffff;
    --border: #e5e7eb;
    --accent: #6366f1;
    --shadow: 0 10px 25px rgba(0,0,0,.06);
}

body.dark {
    --bg: #0b0f19;
    --text: #f8fafc;
    --muted: #cbd5f5;
    --card: #111827;
    --border: #1f2933;
    --accent: #818cf8;
    --shadow: 0 20px 40px rgba(0,0,0,.45);
}

/* =====================
   GLOBAL
===================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
}

section {
    max-width: 1100px;
    margin: auto;
    padding: 90px 20px;
}

h1, h2 {
    letter-spacing: -0.03em;
}

p {
    color: var(--muted);
    line-height: 1.7;
}

/* =====================
   NAVBAR
===================== */
header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 100;
}

.nav {
    max-width: 1200px;
    margin: auto;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-weight: 700;
    letter-spacing: .08em;
}

.nav-links {
    display: flex;
    gap: 18px;
    align-items: center;
}

.nav-links a {
    font-size: .9rem;
    opacity: .75;
    transition: opacity .2s;
}

.nav-links a:hover {
    opacity: 1;
}

.btn {
    border: 1px solid var(--border);
    background: none;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: .8rem;
}

/* =====================
   ANIMATIONS
===================== */
.fade-up {
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp .8s ease forwards;
}

.delay-1 { animation-delay: .2s; }
.delay-2 { animation-delay: .4s; }

@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =====================
   HOME
===================== */
.home {
    text-align: center;
    padding-top: 130px;
}

.home h1 {
    font-size: clamp(2.6rem, 5vw, 4rem);
    margin-bottom: 16px;
}

/* =====================
   BOTS
===================== */
.bot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 26px;
}

.bot-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
    box-shadow: var(--shadow);
    transition: transform .3s, box-shadow .3s;
}

.bot-card:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 30px 60px rgba(0,0,0,.18);
}

.bot-card h3 {
    margin-bottom: 10px;
}

.invite {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 18px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: .85rem;
    transition: opacity .2s;
}

.invite:hover {
    opacity: .9;
}

/* =====================
   FOOTER
===================== */
footer {
    border-top: 1px solid var(--border);
    text-align: center;
    padding: 40px 20px;
    font-size: .85rem;
    color: var(--muted);
}
</style>
</head>

<body>

<header>
<nav class="nav">
    <div class="logo">INFINITY TEAM</div>
    <div class="nav-links">
        <a href="#home" data-i18n="home">Home</a>
        <a href="#about" data-i18n="about">About</a>
        <a href="#terms" data-i18n="terms">Terms</a>
        <a href="#bots" data-i18n="bots">Bots</a>
        <button class="btn" onclick="toggleLang()">EN / PT</button>
        <button class="btn" onclick="toggleTheme()">🌙</button>
    </div>
</nav>
</header>

<section id="home" class="home fade-up">
    <h1 data-i18n="title">INFINITY TEAM</h1>
    <p data-i18n="subtitle" class="delay-1 fade-up">
        Professional and innovative technology & bot development team.
    </p>
</section>

<section id="about" class="fade-up delay-1">
    <h2 data-i18n="aboutTitle">About Us</h2>
    <p data-i18n="aboutText">
        INFINITY TEAM is focused on automation, advanced bots, and modern solutions,
        delivering performance, security, and high-quality user experiences.
    </p>
</section>

<section id="terms" class="fade-up delay-2">
    <h2 data-i18n="termsTitle">Terms of Service</h2>
    <p data-i18n="termsText">
        By using our services, you agree to all terms and conditions. Services are
        provided "as is" with no warranties.
    </p>
</section>

<section id="bots">
    <h2 class="fade-up" data-i18n="botsTitle">Our Bots</h2>

    <div class="bot-grid">
        <div class="bot-card fade-up delay-1">
            <h3>Infinity Manager</h3>
            <p data-i18n="bot1">Advanced moderation and automation.</p>
            <a href="#" class="invite">Invite</a>
        </div>

        <div class="bot-card fade-up delay-2">
            <h3>Infinity Tools</h3>
            <p data-i18n="bot2">Productivity and server utilities.</p>
            <a href="#" class="invite">Invite</a>
        </div>

        <div class="bot-card fade-up delay-2">
            <h3>Infinity AI</h3>
            <p data-i18n="bot3">AI-powered smart interactions.</p>
            <a href="#" class="invite">Invite</a>
        </div>
    </div>
</section>

<footer>
    © 2026 INFINITY TEAM
</footer>

<script>
/* =====================
   THEME
===================== */
function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme",
        document.body.classList.contains("dark") ? "dark" : "light");
}
if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}

/* =====================
   LANGUAGE SYSTEM
===================== */
let lang = localStorage.getItem("lang") || "en";

const translations = {
    en: {
        home: "Home",
        about: "About Us",
        terms: "Terms",
        bots: "Bots",
        title: "INFINITY TEAM",
        subtitle: "Professional and innovative technology & bot development team.",
        aboutTitle: "About Us",
        aboutText: "INFINITY TEAM is focused on automation, advanced bots, and modern solutions, delivering performance, security, and high-quality user experiences.",
        termsTitle: "Terms of Service",
        termsText: "By using our services, you agree to all terms and conditions. Services are provided 'as is'.",
        botsTitle: "Our Bots",
        bot1: "Advanced moderation and automation.",
        bot2: "Productivity and server utilities.",
        bot3: "AI-powered smart interactions."
    },
    pt: {
        home: "Início",
        about: "Sobre",
        terms: "Termos",
        bots: "Bots",
        title: "INFINITY TEAM",
        subtitle: "Time profissional e inovador de tecnologia e desenvolvimento de bots.",
        aboutTitle: "Sobre Nós",
        aboutText: "A INFINITY TEAM é focada em automação, bots avançados e soluções modernas, garantindo performance, segurança e ótima experiência.",
        termsTitle: "Termos de Serviço",
        termsText: "Ao usar nossos serviços, você concorda com todos os termos e condições.",
        botsTitle: "Nossos Bots",
        bot1: "Moderação e automação avançada.",
        bot2: "Ferramentas e utilidades para servidores.",
        bot3: "Interações inteligentes com IA."
    }
};

function applyLang() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = translations[lang][el.dataset.i18n];
    });
}

function toggleLang() {
    lang = lang === "en" ? "pt" : "en";
    localStorage.setItem("lang", lang);
    applyLang();
}

applyLang();
</script>

</body>
</html>
